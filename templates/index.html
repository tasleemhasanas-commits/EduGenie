<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - Learning Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #243b6b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #243b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1b2f56;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5ff;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
            min-height: 80px;
        }

        .loading {
            color: #555;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>EduGenie</h1>
    <p>Google Gemini Powered Learning Assistant</p>
</header>

<div class="container">
    <div class="card">

        <label for="task">Select Learning Task</label>

        <select id="task">
            <option value="qa">Ask a Question</option>
            <option value="explain">Explain a Topic</option>
            <option value="quiz">Generate Quiz</option>
            <option value="summarize">Summarize Text</option>
            <option value="learn">Recommend Learning Path</option>
        </select>

        <label for="inputText">Enter your question, topic, or text</label>

        <textarea
            id="inputText"
            placeholder="Example: What is Artificial Intelligence?"
        ></textarea>

        <button id="submitButton" onclick="runEduGenie()">
            Ask EduGenie
        </button>

        <div id="result" class="result">
            Your EduGenie response will appear here.
        </div>

    </div>
</div>

<footer>
    EduGenie &copy; 2026 | AI Powered Learning Assistant
</footer>


<script>

async function runEduGenie() {

    const task = document.getElementById("task").value;
    const inputText = document.getElementById("inputText").value.trim();
    const result = document.getElementById("result");
    const button = document.getElementById("submitButton");

    if (!inputText) {
        result.textContent = "Please enter something first.";
        return;
    }

    const endpoints = {
        qa: "/qa",
        explain: "/explain",
        quiz: "/quiz",
        summarize: "/summarize",
        learn: "/learn/recommendations"
    };

    const endpoint = endpoints[task];

    button.disabled = true;
    button.textContent = "EduGenie is thinking...";
    result.textContent = "Generating response...";

    try {

        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: inputText
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Something went wrong.");
        }

        result.textContent = data.answer || "No response received.";

    } catch (error) {

        result.textContent = "Error: " + error.message;

    } finally {

        button.disabled = false;
        button.textContent = "Ask EduGenie";

    }
}

</script>

</body>
</html>
